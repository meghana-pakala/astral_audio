<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harmony of the Spheres - Error</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --navy:      #080A23;
  --navy-mid:  #111830;
  --navy-card: #141c35;
  --gold:      #d4af6a;
  --gold-dim:  #a88840;
  --gold-pale: #f0dfa0;
  --cream:     #f2e8cc;
  --border-dim: rgba(212,175,106,0.1);
  --border:    rgba(212,175,106,0.18);
  --border-mid: rgba(212,175,106,0.35);
  --border-h:  rgba(212,175,106,0.45);
  --text-dim:  rgba(242,232,204,0.5);
  --cinzel:    'Cinzel Decorative', Georgia, serif;
  --mono:      'Space Mono', monospace;
  --serif:     'Cormorant Garamond', Georgia, serif;
}

*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: #080A23;
  font-family: 'Space Mono', monospace;
  color: var(--cream);
  min-height: 100vh;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
}
a { color: var(--gold); text-decoration: none; }

/* ── Starfield ── */
body::before {
  content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    radial-gradient(1.5px 1.5px at 63.8% 3.0%,  rgba(255,255,255,0.64) 0%, transparent 100%),
    radial-gradient(2.5px 2.5px at 73.4% 67.5%, rgba(255,255,255,0.58) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 42.3% 3.4%,  rgba(255,255,255,0.75) 0%, transparent 100%),
    radial-gradient(2px   2px   at 3.1%  20.2%, rgba(255,255,255,0.77) 0%, transparent 100%),
    radial-gradient(2.5px 2.5px at 22.3% 58.8%, rgba(255,255,255,0.55) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 80.3% 69.6%, rgba(255,255,255,0.61) 0%, transparent 100%),
    radial-gradient(1px   1px   at 95.3% 33.8%, rgba(255,255,255,0.59) 0%, transparent 100%),
    radial-gradient(2.5px 2.5px at 84.4% 60.3%, rgba(255,255,255,0.84) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 53.6% 96.8%, rgba(255,255,255,0.77) 0%, transparent 100%),
    radial-gradient(2.5px 2.5px at 82.6% 61.7%, rgba(255,255,255,0.78) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 70.3% 5.0%,  rgba(255,255,255,0.67) 0%, transparent 100%),
    radial-gradient(1px   1px   at 8.4%  23.5%, rgba(255,255,255,0.66) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 63.4% 36.6%, rgba(255,255,255,0.63) 0%, transparent 100%),
    radial-gradient(2px   2px   at 26.9% 93.2%, rgba(255,255,255,0.79) 0%, transparent 100%),
    radial-gradient(1px   1px   at 17.4% 72.7%, rgba(255,255,255,0.7)  0%, transparent 100%),
    radial-gradient(2px   2px   at 98.5% 63.9%, rgba(255,255,255,0.82) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 83.9% 77.3%, rgba(255,255,255,0.56) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 31.7% 27.0%, rgba(255,255,255,0.93) 0%, transparent 100%),
    radial-gradient(2px   2px   at 87.3% 31.7%, rgba(255,255,255,0.71) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 91.0% 45.9%, rgba(255,255,255,0.65) 0%, transparent 100%),
    radial-gradient(2px   2px   at 56.1% 26.5%, rgba(255,255,255,0.91) 0%, transparent 100%),
    radial-gradient(3px   3px   at 40.0% 22.2%, rgba(255,255,255,0.75) 0%, transparent 100%),
    radial-gradient(1px   1px   at 9.5%  5.2%,  rgba(255,255,255,0.8)  0%, transparent 100%),
    radial-gradient(1px   1px   at 78.9% 42.3%, rgba(255,255,255,0.7)  0%, transparent 100%),
    radial-gradient(3px   3px   at 99.1% 52.9%, rgba(255,255,255,0.89) 0%, transparent 100%),
    radial-gradient(2px   2px   at 1.6%  71.9%, rgba(255,255,255,0.76) 0%, transparent 100%),
    radial-gradient(1px   1px   at 26.9% 64.0%, rgba(255,255,255,0.72) 0%, transparent 100%),
    radial-gradient(2.5px 2.5px at 45.4% 94.9%, rgba(255,255,255,0.66) 0%, transparent 100%),
    radial-gradient(2.5px 2.5px at 50.1% 18.2%, rgba(255,255,255,0.9)  0%, transparent 100%),
    radial-gradient(2px   2px   at 30.0% 63.8%, rgba(255,255,255,0.61) 0%, transparent 100%),
    radial-gradient(3px   3px   at 45.5% 42.4%, rgba(255,255,255,0.95) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 25.2% 91.9%, rgba(255,255,255,0.89) 0%, transparent 100%),
    radial-gradient(3px   3px   at 55.0% 5.5%,  rgba(255,255,255,0.88) 0%, transparent 100%),
    radial-gradient(1.5px 1.5px at 7.5%  63.0%, rgba(255,255,255,0.91) 0%, transparent 100%),
    radial-gradient(2.5px 2.5px at 21.7% 13.6%, rgba(255,255,255,0.78) 0%, transparent 100%),
    radial-gradient(3px   3px   at 7.7%  45.9%, rgba(255,255,255,0.95) 0%, transparent 100%),
    radial-gradient(2px   2px   at 83.0% 70.2%, rgba(255,255,255,0.94) 0%, transparent 100%);
}

/* ── Layout ── */
.page {
  position: relative; z-index: 1;
  max-width: 820px; margin: 0 auto;
  padding: 32px 32px 80px;
  flex: 1;
  display: flex;
  flex-direction: column;
  animation: fadeIn .4s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ── Nav ── */
nav {
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 40px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.logo {
  font-family: 'Cinzel Decorative', Georgia, serif;
  font-size: clamp(14px, 1.8vw, 22px);
  font-weight: 700;
  letter-spacing: -0.5px;
  color: var(--gold);
}

/* ── Error card ── */
.error-card {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  text-align: center;
  padding: 40px 0 40px;
}

.error-heading {
  font-family: 'Space Mono', monospace;
  font-size: clamp(0.9rem, 1.6vw, 1.1rem);
  font-weight: 700;
  color: var(--cream);
  letter-spacing: 0.1em;
  font-style: italic;
  margin-bottom: 25px;
}

.error-divider {
  width: 90px;
  height: 1px;
  background: var(--border-mid);
  margin: 0 auto;
}

.error-body {
  font-family: 'Space Mono', monospace;
  font-size: .8rem;
  line-height: 1.85;
  color: var(--gold);
  font-style: italic;
  max-width: 480px;
  letter-spacing: 0.03em;
  margin-top: 20px;
  margin-bottom: 20px
}

.error-detail {
  font-family: 'Space Mono', monospace;
  font-size: 0.65rem;
  color: var(--text-dim);
  background: rgba(212,175,106,0.04);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 10px 18px;
  max-width: 560px;
  line-height: 1.7;
  word-break: break-word;
  margin-top: 20px;
  margin-bottom: 20px;
}

.error-back {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: 'Space Mono', monospace;
  font-size: 0.8rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold);
  border: 1px solid var(--border-mid);
  border-radius: 3px;
  padding: 10px 24px;
  transition: all .15s;
  margin-top: 20px;
}
.error-back:hover {
  background: rgba(212,175,106,0.08);
  border-color: var(--gold);
  color: var(--gold);
}

@media (max-width: 640px) {
  .page { padding: 24px 20px 60px; }
}
</style>
</head>
<body>

<div class="page">
  <nav>
    <a href="/" class="logo">Harmony of the Spheres</a>
  </nav>

  <div class="error-card">
    <h1 class="error-heading">Your reading encountered a black hole.</h1>
    <div class="error-divider"></div>
    <p class="error-body">What was written in the stars was briefly unwritten.<br>Try again when the skies are clear.</p>
    {% if error %}
    <div class="error-detail">{{ error }}</div>
    {% endif %}
    <a href="/" class="error-back">← Rewrite the stars</a>
  </div>
</div>

</body>
</html>
