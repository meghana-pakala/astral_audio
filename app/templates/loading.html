<style>

  --navy:      #080A23;
  --navy-mid:  #111830;

  --gold:      #d4af6a;
  --gold-dim:  #a88840;
  --gold-pale: #f0dfa0;
  --cream:     #f2e8cc;
  --border-dim: rgba(212,175,106,0.1);
  --border:    rgba(212,175,106,0.18);
  --border-mid: rgba(212,175,106,0.35);
  --border-h:  rgba(212,175,106,0.45);
  --text-dim:  rgba(242,232,204,0.5);

  --cinzel:  'Cinzel Decorative', Georgia, serif;
  --mono:    'Space Mono', monospace;
  --serif:   'Cormorant Garamond', Georgia, serif;
}

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }

body {
  background:#080A23;
  font-family: var(--mono);
  color: var(--cream);
  min-height:100vh;
  overflow:hidden;
}

/* ── Loading page ── */
.loading-page {
  min-height:100vh;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:48px; position:relative;
  z-index:1;
}

/* Natal chart backdrop — 7% opacity */
.load-chart-bg {
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  opacity:0.07; pointer-events:none;
}
.load-chart-bg svg { width:min(70vh,70vw); height:min(70vh,70vw); }

/* Spinning orbital ring */
.load-ring { position:relative; width:280px; height:280px; z-index:1; }
.load-ring svg { width:100%; height:100%; animation:orb 12s linear infinite; }
@keyframes orb { to { transform:rotate(360deg); } }

/* Star-glow orbs */
.star-glow {
  position:absolute; width:12px; height:12px; border-radius:50%;
  background: var(--gold-pale);
  box-shadow:0 0 20px 7px rgba(240,223,160,.7), 0 0 40px 14px rgba(240,223,160,.2);
}
.star-glow::before, .star-glow::after {
  content:''; position:absolute; top:50%; left:50%;
  transform:translate(-50%,-50%); background: var(--gold-pale);
}
.star-glow::before { width:1.5px; height:44px; }
.star-glow::after  { width:44px;  height:1.5px; }

.sg1 { top:10%; left:30%; animation:sf 4s ease-in-out infinite; }
.sg2 { bottom:16%; right:26%; animation:sf 4s ease-in-out 2s infinite; }
@keyframes sf {
  0%,100% { transform:translateY(0); opacity:1; }
  50%     { transform:translateY(-10px); opacity:.55; }
}

/* Loading text */
.load-text {
  font-family: var(--serif);
  font-size:18px; font-style:italic;
  color: var(--gold-pale); letter-spacing:.1em;
  z-index:1;
  animation:pulse 2.4s ease-in-out infinite;
}
.load-dots span { animation:blink 1.4s ease-in-out infinite; opacity:0; }
.load-dots span:nth-child(2) { animation-delay:.2s; }
.load-dots span:nth-child(3) { animation-delay:.4s; }

@keyframes blink { 0%,80%,100% { opacity:0; } 40% { opacity:1; } }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.5; } }

/* Fade-in on load */
.loading-page { animation:fadeIn .5s ease both; }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
</style>
</head>
<body>

<div class="loading-page">

  <!-- Natal chart as faint backdrop -->
  <div class="load-chart-bg">
    <svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
      <!-- Outer rings -->
      <circle cx="300" cy="300" r="280" fill="none" stroke="rgba(212,175,106,0.9)" stroke-width="1.2"/>
      <circle cx="300" cy="300" r="240" fill="none" stroke="rgba(212,175,106,0.7)" stroke-width="0.8"/>
      <circle cx="300" cy="300" r="200" fill="none" stroke="rgba(212,175,106,0.5)" stroke-width="0.8"/>
      <circle cx="300" cy="300" r="160" fill="none" stroke="rgba(212,175,106,0.4)" stroke-width="0.8" stroke-dasharray="5 8"/>
      <circle cx="300" cy="300" r="120" fill="none" stroke="rgba(212,175,106,0.3)" stroke-width="0.6" stroke-dasharray="2 5"/>

      <line x1="44"  y1="444" x2="556" y2="156" stroke="rgba(212,175,106,0.22)" stroke-width="0.5"/>
      <line x1="156" y1="556" x2="444" y2="44"  stroke="rgba(212,175,106,0.22)" stroke-width="0.5"/>
      <line x1="20"  y1="196" x2="580" y2="404" stroke="rgba(212,175,106,0.18)" stroke-width="0.5"/>
      <line x1="20"  y1="404" x2="580" y2="196" stroke="rgba(212,175,106,0.18)" stroke-width="0.5"/>
      <line x1="196" y1="580" x2="404" y2="20"  stroke="rgba(212,175,106,0.18)" stroke-width="0.5"/>
      <line x1="404" y1="580" x2="196" y2="20"  stroke="rgba(212,175,106,0.18)" stroke-width="0.5"/>
      <!-- Aspect lines -->

      <line x1="480" y1="180" x2="340" y2="530" stroke="rgba(212,175,106,0.25)" stroke-width="0.7"/>
      <line x1="194" y1="78"  x2="80"  y2="290" stroke="rgba(212,175,106,0.22)" stroke-width="0.7"/>
      <!-- Planet dots with glow -->
      <circle cx="194" cy="78"  r="6"   fill="rgba(212,175,106,0.9)" filter="url(#glow)"/>
      <circle cx="450" cy="390" r="5"   fill="rgba(212,175,106,0.8)"/>
      <circle cx="120" cy="420" r="5.5" fill="rgba(212,175,106,0.85)"/>
      <circle cx="480" cy="180" r="4.5" fill="rgba(212,175,106,0.75)"/>

      <circle cx="500" cy="310" r="4.5" fill="rgba(212,175,106,0.75)"/>
      <circle cx="260" cy="48"  r="3.5" fill="rgba(212,175,106,0.65)"/>
      <circle cx="530" cy="240" r="4"   fill="rgba(212,175,106,0.7)"/>
      <!-- Center -->
      <circle cx="300" cy="300" r="10" fill="none" stroke="rgba(212,175,106,0.5)" stroke-width="1"/>

      <defs>
        <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
          <feGaussianBlur stdDeviation="4" result="blur"/>
          <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
    </svg>

  <!-- Spinning orbital ring -->
  <div class="load-ring">
    <svg viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg">
      <circle cx="140" cy="140" r="130" fill="none" stroke="rgba(212,175,106,.1)" stroke-width="1"/>

      <circle cx="140" cy="140" r="62"  fill="none" stroke="rgba(212,175,106,.08)" stroke-width="1"/>
      <!-- Glowing arc highlights -->
      <path d="M 140 10 A 130 130 0 0 1 270 140" fill="none" stroke="rgba(212,175,106,.5)" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 140 186 A 96 96 0 0 0 44 140"   fill="none" stroke="rgba(212,175,106,.3)" stroke-width="1.5" stroke-linecap="round"/>
    </svg>
    <div class="star-glow sg1"></div>
    <div class="star-glow sg2"></div>
  </div>

  <p class="load-text" id="loadText">reading your stars<span class="load-dots"><span>.</span><span>.</span><span>.</span></span></p>

</div>

<script>
var es = new EventSource('/progress');
es.onmessage = function(e) {
  var data = JSON.parse(e.data);
  if (data.event === 'phase') {
    var el = document.getElementById('loadText');
    el.childNodes[0].nodeValue = data.message;
  } else if (data.event === 'done') {
    es.close();
    window.location.href = '/result';
  } else if (data.event === 'error') {
    es.close();
    window.location.href = '/?error=pipeline';
  }
};
es.onerror = function() {
  es.close();
  window.location.href = '/?error=pipeline';
};
</script>

</body>
</html>
